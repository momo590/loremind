[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "loremind"
version = "0.1.0"
description = "Your AI remembers every story you tell — cross-session memory for TTRPG Game Masters"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["ttrpg", "dnd", "gm", "campaign", "memory", "ai", "mcp"]
dependencies = [
    "watchdog>=4.0.0",          # file system watcher
    "anthropic>=0.25.0",        # LLM for structuring notes
    "click>=8.1.0",             # CLI
    "flask>=3.0.0",             # WhatsApp webhook server
    "requests>=2.31.0",         # HTTP client
    "pillow>=10.0.0",           # image handling (scan preprocessing)
    "rich>=13.0.0",             # terminal output
    "python-dotenv>=1.0.0",     # .env config
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-mock>=3.14.0"]

[project.scripts]
loremind = "loremind.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["loremind"]
