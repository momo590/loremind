[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "loremind"
version = "0.1.0"
description = "Your AI remembers every story you tell — cross-session memory for TTRPG Game Masters"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["ttrpg", "dnd", "gm", "campaign", "memory", "ai", "mcp"]
dependencies = [
    "anthropic>=0.25.0",        # default cloud LLM provider
    "click>=8.1.0",             # CLI
    "rich>=13.0.0",             # terminal output
    "python-dotenv>=1.0.0",     # .env config
    "watchdog>=4.0.0",          # used by audio capture queue (T7)
    "rapidfuzz>=3.0.0",         # entity fuzzy-merge (T4)
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-mock>=3.14.0"]
audio = ["whisper-cpp-python>=0.2.0"]  # T7 optional Whisper.cpp wrapper

[project.scripts]
loremind = "loremind.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["loremind"]
